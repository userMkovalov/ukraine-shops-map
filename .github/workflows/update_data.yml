name: Update Shop Data

on:
  schedule:
    # 01:00 UTC = 04:00 (Літній час) / 03:00 (Зимовий час) за Києвом
    - cron: '0 1 * * *'
  # Дозволяє запустити оновлення вручну через кнопку у вкладці Actions
  workflow_dispatch:

jobs:
  update-shops:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Дозвіл робити commit/push у репозиторій

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper script
        run: |
          python new_geo_get.py

      - name: Commit and Push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add all_shops.json all_shops.xlsx
          
          # Перевірка чи є зміни перед коммітом
          git diff --staged --quiet || (git commit -m "auto: update shop data [skip ci]" && git push)
